<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test API Python-JS</title>
</head>
<body>
    <h2>Test Chiamata API: Addizione</h2>
    
    <input type="number" id="num1" placeholder="Primo numero">
    <span> + </span>
    <input type="number" id="num2" placeholder="Secondo numero">
    
    <button onclick="richiediSomma()">Calcola via Python</button>
    
    <h3 id="testo-risultato" style="color: blue;"></h3>

    <script>
        async function richiediSomma() {
            // 1. Prende i valori dai campi di input
            const n1 = document.getElementById('num1').value;
            const n2 = document.getElementById('num2').value;

            try {
                // 2. Fa la chiamata POST all'API Python
                const risposta = await fetch('http://127.0.0.1:8000/api/somma', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Diciamo a Python che inviamo un JSON
                    },
                    body: JSON.stringify({
                        numero1: parseFloat(n1), 
                        numero2: parseFloat(n2)
                    })
                });

                // 3. Riceve la risposta (il totale) e la converte
                const dati = await risposta.json();

                // 4. Mostra il risultato a schermo
                document.getElementById('testo-risultato').innerText = "Risultato dal Backend: " + dati.risultato;
                
            } catch (errore) {
                console.error("C'è stato un problema di connessione:", errore);
                document.getElementById('testo-risultato').innerText = "Errore di connessione API.";
            }
        }
    </script>
</body>
</html>
